apiVersion: v2
name: whatchanged
description: Answers the first question of every incident, "what changed?". Watches rollouts, ConfigMaps, Helm, Argo CD, Flux, network policies and nodes, takes pushed changes from CI, and ranks the likely culprits
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.25.0-0"
keywords:
  - sre
  - incident
  - change-tracking
  - change-management
  - kubernetes
  - observability
  - grafana
  - argocd
  - flux
home: https://github.com/simplyzee/whatchanged
icon: https://raw.githubusercontent.com/simplyzee/whatchanged/main/docs/icon.png
sources:
  - https://github.com/simplyzee/whatchanged
maintainers:
  - name: simplyzee
    email: zee@simplyzee.dev
    url: https://simplyzee.dev
annotations:
  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: Apache-2.0
  # Keep in sync with appVersion.
  artifacthub.io/images: |
    - name: whatchanged
      image: ghcr.io/simplyzee/whatchanged:0.1.0
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/links: |
    - name: support
      url: https://github.com/simplyzee/whatchanged/issues
  artifacthub.io/changes: |
    - kind: added
      description: First release. Tracks Deployments, StatefulSets, DaemonSets, ConfigMaps, Helm releases, Argo CD, Flux, NetworkPolicies, Cilium policies, nodes and Warning events, with a push API, suspect ranking, Grafana annotations and a web UI
