apiVersion: v2
name: whatchanged
description: Answers the first question of every incident, "what changed?". Watches rollouts, config, Helm, GitOps, routing, RBAC, admission, certificates, network policies and nodes, takes pushed changes from CI, ranks the likely culprits and serves it all over MCP
type: application
version: 0.2.0
appVersion: "0.2.0"
kubeVersion: ">=1.25.0-0"
keywords:
  - sre
  - incident
  - change-tracking
  - change-management
  - kubernetes
  - observability
  - grafana
  - argocd
  - flux
  - mcp
  - rbac
home: https://github.com/simplyzee/whatchanged
icon: https://raw.githubusercontent.com/simplyzee/whatchanged/main/docs/icon.png
sources:
  - https://github.com/simplyzee/whatchanged
maintainers:
  - name: simplyzee
    email: zee@simplyzee.dev
    url: https://simplyzee.dev
annotations:
  artifacthub.io/category: monitoring-logging
  artifacthub.io/license: Apache-2.0
  # Keep in sync with appVersion.
  artifacthub.io/images: |
    - name: whatchanged
      image: ghcr.io/simplyzee/whatchanged:0.2.0
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/links: |
    - name: support
      url: https://github.com/simplyzee/whatchanged/issues
  artifacthub.io/changes: |
    - kind: added
      description: New trackers for Services, Ingresses, Gateway API, HPAs, KEDA, PDBs, PriorityClasses, ResourceQuotas, LimitRanges, CRDs, admission webhooks and policies, RBAC, cert-manager, Kong and Cilium egress/BGP/LB IPAM
    - kind: added
      description: Symptoms are linked to the change that caused them via owner references and ConfigMap/Secret usage
    - kind: added
      description: Redacted per-change diffs (diffs value), and risk flags for manual, off-hours and change-freeze changes (risk values)
    - kind: added
      description: MCP server at POST /mcp for AI agents
    - kind: changed
      description: ClusterRole now covers the new resource types, plus Pod, ReplicaSet and Job metadata for correlation
