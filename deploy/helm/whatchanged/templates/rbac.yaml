{{- if .Values.rbac.create }}
{{- $v := .Values }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "whatchanged.fullname" . }}
  labels:
    {{- include "whatchanged.labels" . | nindent 4 }}
rules:
  # Read-only: whatchanged never writes to the cluster.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "nodes", "events"]
    verbs: ["list", "watch"]
  {{- if or (include "whatchanged.trackerOn" (list "helm-releases" true $v)) (include "whatchanged.trackerOn" (list "secrets" false $v)) }}
  # Helm stores releases in Secrets. The helm tracker only requests object
  # metadata (labels), never the release payload.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list", "watch"]
  {{- end }}
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["list", "watch"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies", "ciliumclusterwidenetworkpolicies"]
    verbs: ["list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["list", "watch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["list", "watch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "whatchanged.fullname" . }}
  labels:
    {{- include "whatchanged.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "whatchanged.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "whatchanged.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
