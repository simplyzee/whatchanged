{{- if .Values.rbac.create }}
{{- $v := .Values }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "whatchanged.fullname" . }}
  labels:
    {{- include "whatchanged.labels" . | nindent 4 }}
rules:
  # Read-only: whatchanged never writes to the cluster.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "nodes", "events", "services", "pods", "resourcequotas", "limitranges"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["list", "watch"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations", "validatingadmissionpolicies", "validatingadmissionpolicybindings"]
    verbs: ["list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "clusterroles", "rolebindings", "clusterrolebindings"]
    verbs: ["list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes", "grpcroutes"]
    verbs: ["list", "watch"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "issuers", "clusterissuers"]
    verbs: ["list", "watch"]
  - apiGroups: ["configuration.konghq.com"]
    resources: ["kongplugins", "kongclusterplugins", "kongingresses"]
    verbs: ["list", "watch"]
  {{- if or (include "whatchanged.trackerOn" (list "helm-releases" true $v)) (include "whatchanged.trackerOn" (list "secrets" false $v)) }}
  # Helm stores releases in Secrets. The helm tracker only requests object
  # metadata (labels), never the release payload.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list", "watch"]
  {{- end }}
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["list", "watch"]
  - apiGroups: ["cilium.io"]
    resources:
      - ciliumnetworkpolicies
      - ciliumclusterwidenetworkpolicies
      - ciliumegressgatewaypolicies
      - ciliumbgppeeringpolicies
      - ciliumbgpclusterconfigs
      - ciliumbgppeerconfigs
      - ciliumbgpadvertisements
      - ciliumloadbalancerippools
      - ciliuml2announcementpolicies
    verbs: ["list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["list", "watch"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["list", "watch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "whatchanged.fullname" . }}
  labels:
    {{- include "whatchanged.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "whatchanged.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "whatchanged.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
