{{- if and .Values.ingest.enabled (not .Values.ingest.existingSecret) }}
{{- $name := include "whatchanged.ingestSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "whatchanged.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (index $existing.data .Values.ingest.secretKey) }}
  {{ .Values.ingest.secretKey }}: {{ index $existing.data .Values.ingest.secretKey }}
  {{- else }}
  {{ .Values.ingest.secretKey }}: {{ randAlphaNum 40 | b64enc }}
  {{- end }}
{{- end }}
